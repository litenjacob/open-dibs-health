name: Open Dibs independent health
on:
  schedule:
    - cron: '19 * * * *'
  workflow_dispatch:
    inputs:
      simulate_health_failure:
        type: boolean
        default: false
        description: Controlled monitor fault injection
permissions:
  contents: read
  issues: write
concurrency:
  group: independent-health
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '26.13.0'
      - run: node monitor.mjs
        env:
          SIMULATE_HEALTH_FAILURE: ${{ inputs.simulate_health_failure }}
          GITHUB_TOKEN: ${{ github.token }}
          NOTIFIER_TOKEN: ${{ secrets.NOTIFIER_TOKEN }}
